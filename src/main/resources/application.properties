  Cont�m tamb�m valor em reais, defini��o de estabelecimento e a��es (compra, gastos...)

spring.ai.model.audio.speech=elevenlabs
spring.ai.elevenlabs.api-key=${ELEVENLABS_API_KEY}
spring.ai.elevenlabs.tts.options.voice-id=e3yjeWnwuGsHvboTqMyB
spring.ai.elevenlabs.tts.options.output-format=mp3_22050_32

spring.jpa.show-sql=true

loggin.level.org.springframework.ai=DEBUG